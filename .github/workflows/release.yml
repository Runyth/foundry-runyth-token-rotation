name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify tag
        run: node --input-type=module -e "import {readFile} from 'node:fs/promises'; const version=JSON.parse(await readFile('module.json','utf8')).version; if (process.env.GITHUB_REF_NAME !== 'v'+version) { console.error('Tag does not match module version'); process.exit(1); }"
      - name: Verify and build
        run: npm run check
      - name: Publish release artifacts
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231
        with:
          files: |
            dist/runyth-token-rotation-v*-mod.zip
            dist/runyth-token-rotation-v*-src.zip
            dist/runyth-token-rotation-v*-doc.zip
            dist/runyth-token-rotation-v*-SHA256SUMS.txt
            module.json
